# kit の検査。シェルスクリプトの静的検査と、tests/run.sh のスモークテスト。
# kit はすべてのアプリのリポジトリから v1 のタグで使われるので、壊れた版を出さないよう PR ごとに流す。
# Linux の bash は 5 系なので、bash 3.2 でしか起きない不具合は拾えない。PR を出す前に macOS の /bin/bash で tests/run.sh を流す
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: ShellCheck
        run: shellcheck bin/*.sh shim/scripts/*.sh install.sh tests/run.sh
      - name: Smoke test
        run: tests/run.sh
